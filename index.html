
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power Chatt</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#0b0b0f;
      color:white;
      font-family:Arial,sans-serif;
    }
    .app{
      max-width:500px;
      min-height:100vh;
      margin:auto;
      background:#15151c;
    }
    header{
      padding:20px;
      text-align:center;
      font-size:28px;
      font-weight:bold;
      background:#20202a;
    }
    .logo{color:#8b5cf6}
    .hero{
      padding:35px 20px;
      text-align:center;
    }
    .hero h1{font-size:32px;margin:10px 0}
    .hero p{color:#aaa}
    .buttons{
      display:flex;
      gap:12px;
      justify-content:center;
      margin-top:25px;
    }
    button{
      border:0;
      border-radius:12px;
      padding:14px 22px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }
    .primary{
      background:#8b5cf6;
      color:white;
    }
    .secondary{
      background:#292936;
      color:white;
    }
    .rooms{
      padding:20px;
    }
    .rooms h2{margin-bottom:15px}
    .room{
      background:#22222c;
      padding:16px;
      border-radius:14px;
      margin-bottom:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .room span{color:#aaa;font-size:13px}
    footer{
      text-align:center;
      padding:25px;
      color:#777;
      font-size:13px;
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      <span class="logo">Power</span> Chatt
    </header>

    <section class="hero">
      <h1>Power Chatt</h1>
      <p>Yeni insanlarla tanış, sohbet et ve eğlen.</p>

      <div class="buttons">
        <button class="primary" onclick="alert('Yakında kayıt ekranı açılacak!')">
          Kayıt Ol
        </button>

        <button class="secondary" onclick="alert('Yakında giriş ekranı açılacak!')">
          Giriş Yap
        </button>
      </div>
    </section>

    <section class="rooms">
      <h2>Sohbet Odaları</h2>

      <div class="room">
        <div>
          🇹🇷 Türkiye
          <br>
          <span>Genel sohbet</span>
        </div>
        <button class="primary" onclick="alert('Odaya katılma yakında aktif olacak!')">
          Katıl
        </button>
      </div>

      <div class="room">
        <div>
          🇦🇿 Azerbaycan
          <br>
          <span>Genel sohbet</span>
        </div>
        <button class="primary" onclick="alert('Odaya katılma yakında aktif olacak!')">
          Katıl
        </button>
      </div>
    </section>

    <footer>
      © 2026 Power Chatt
    </footer>

  </div>
</body>
</html>
