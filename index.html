<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Chatt</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#08080d;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:linear-gradient(180deg,#171027,#08090e);
  position:relative;
  overflow:hidden;
}

.content{
  padding-bottom:95px;
}

/* ÜST MENÜ */
header{
  padding:20px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:27px;
  font-weight:800;
}

.logo span{
  color:#9b5cff;
}

.icon{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#24183b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

/* HOŞ GELDİN */
.banner{
  margin:5px 15px 20px;
  padding:20px;
  border-radius:22px;
  background:linear-gradient(135deg,#713cff,#b23cff);
  box-shadow:0 10px 35px #6b35a755;
}

.banner h2{
  margin:0 0 8px;
  font-size:22px;
}

.banner p{
  margin:0;
  opacity:.9;
}

/* BÖLÜMLER */
.section{
  padding:0 18px;
  margin-top:22px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-title h3{
  margin:0;
  font-size:18px;
}

.section-title span{
  color:#a875ff;
  font-size:13px;
}

/* ÇEVRİMİÇİ */
.users{
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding-bottom:5px;
}

.users::-webkit-scrollbar{
  display:none;
}

.user{
  min-width:70px;
  text-align:center;
}

.avatar{
  width:64px;
  height:64px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  background:linear-gradient(135deg,#ff4f9a,#7c4dff);
  border:3px solid #a66cff;
}

.user p{
  margin:7px 0 0;
  font-size:12px;
}

/* ANLAR */
.moments{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:8px;
}

.moments::-webkit-scrollbar{
  display:none;
}

.moment{
  min-width:125px;
  height:175px;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  background:linear-gradient(160deg,#783cff,#ee3d91);
  border:1px solid #3a2a50;
}

.moment-bg{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
}

.moment-info{
  position:absolute;
  left:9px;
  right:9px;
  bottom:8px;
  padding:8px;
  border-radius:12px;
  background:#00000080;
  backdrop-filter:blur(5px);
}

.moment-info b{
  font-size:12px;
}

.moment-info small{
  display:block;
  margin-top:3px;
  color:#ddd;
  font-size:10px;
}

/* ANINI PAYLAŞ */
.share-moment{
  margin-top:12px;
  padding:15px;
  border:1px dashed #7048a8;
  border-radius:17px;
  background:#171323;
  text-align:center;
}

.share-moment button{
  border:0;
  background:linear-gradient(135deg,#794cff,#b23cff);
  color:white;
  padding:12px 20px;
  border-radius:13px;
  font-weight:bold;
  font-size:14px;
}

/* KİŞİLER */
.card{
  display:flex;
  align-items:center;
  padding:14px;
  margin-bottom:10px;
  background:#171722;
  border:1px solid #272438;
  border-radius:17px;
}

.card .avatar{
  width:52px;
  height:52px;
  min-width:52px;
  font-size:20px;
  border:2px solid #7d55ff;
}

.info{
  flex:1;
  margin-left:12px;
}

.info b{
  font-size:15px;
}

.info small{
  display:block;
  margin-top:5px;
  color:#9995a8;
}

.chat-btn{
  border:0;
  color:#fff;
  background:#794cff;
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}

/* ALT MENÜ */
nav{
  position:fixed;
  bottom:0;
  width:100%;
  max-width:430px;
  height:72px;
  background:#111119ee;
  backdrop-filter:blur(12px);
  border-top:1px solid #292633;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

nav button{
  background:none;
  border:0;
  color:#888493;
  font-size:12px;
}

nav button.active{
  color:#a76cff;
}

nav div{
  font-size:21px;
  margin-bottom:3px;
}

/* YÜKLEME ALANI */
input[type="file"]{
  display:none;
}

#preview{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:15px;
  margin-top:12px;
  display:none;
}
</style>
</head>
