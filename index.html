<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Chatt</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f7f7f7;
  font-family:Arial,sans-serif;
  color:#222;
}

.app{
  max-width:500px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  padding-bottom:80px;
}

.header{
  padding:22px 20px 12px;
  font-size:27px;
  font-weight:bold;
}

.card{
  margin:10px 15px;
  padding:18px;
  border-radius:20px;
  background:#fff;
  box-shadow:0 2px 12px #ddd;
}

.card-title{
  font-size:22px;
  margin-bottom:18px;
}

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  text-align:center;
}

.quick-item{
  font-size:14px;
}

.icon{
  width:58px;
  height:58px;
  margin:auto auto 8px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px;
  background:#eee;
}

.games{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px 8px;
}

.game{
  text-align:center;
  font-size:13px;
  min-width:0;
}

.game-icon{
  width:58px;
  height:58px;
  margin:auto auto 7px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  background:linear-gradient(135deg,#763cff,#ff4d9d);
  box-shadow:0 4px 10px #ccc;
}

.game-name{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.menu-list{
  display:flex;
  flex-direction:column;
  gap:25px;
}

.menu-item{
  display:flex;
  align-items:center;
  gap:17px;
  font-size:18px;
}

.menu-icon{
  width:35px;
  text-align:center;
  font-size:25px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:500px;
  height:72px;
  background:white;
  border-top:1px solid #ddd;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:10;
}

.bottom-item{
  text-align:center;
  padding-top:9px;
  font-size:12px;
}

.bottom-icon{
  font-size:25px;
  display:block;
  margin-bottom:3px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* ROKET */
.rocket-page{
  min-height:calc(100vh - 72px);
  background:linear-gradient(#120b35,#050510);
  color:white;
  padding:20px;
  text-align:center;
}

.back{
  text-align:left;
  font-size:18px;
  margin-bottom:25px;
}

.rocket-title{
  font-size:28px;
  font-weight:bold;
}

.multiplier{
  font-size:58px;
  font-weight:bold;
  margin-top:35px;
}

.rocket-area{
  height:300px;
  position:relative;
  overflow:hidden;
  margin-top:10px;
  border-radius:25px;
  background:
    radial-gradient(circle at 20% 20%,#fff 1px,transparent 2px),
    radial-gradient(circle at 70% 40%,#fff 1px,transparent 2px),
    radial-gradient(circle at 40% 70%,#fff 1px,transparent 2px),
    #080817;
}

.rocket{
  position:absolute;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  font-size:65px;
  transition:bottom .4s;
}

.start-btn{
  margin-top:20px;
  width:100%;
  padding:17px;
  border:0;
  border-radius:15px;
  background:#ff4d6d;
  color:#fff;
  font-size:19px;
  font-weight:bold;
}

.coin{
  margin-top:15px;
  font-size:17px;
}
</style>
</head>

<body>

<div class="app">

<!-- ANA SAYFA -->
<div id="home" class="page active">

<div class="header">
Power Chatt
</div>

<div class="card">
<div class="card-title">Sık kullanılanlar</div>

<div class="quick">
<div class="quick-item">
<div class="icon">💎</div>
Elmas
</div>

<div class="quick-item">
<div class="icon">👩</div>
Ziyaretçi
</div>

<div class="quick-item">
<div class="icon">📅</div>
Görevler
</div>

<div class="quick-item">
<div class="icon">👥</div>
Grup
</div>
</div>
</div>
